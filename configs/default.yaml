# ==========================================================
# Semiconductor Image Restoration Configuration
# ==========================================================

project:
  name: Semiconductor Image Restoration
  version: 1.0

# ==========================================================
# Model Configuration
# ==========================================================

model:
  name: SRDnCNN
  in_channels: 1
  out_channels: 1
  num_features: 64
  num_residual_blocks: 8
  upscale_factor: 2

# ==========================================================
# Dataset
# ==========================================================

dataset:
  train_gt: data/raw/train/GT
  train_noisy: data/raw/train/NoisyLR
  test_noisy: data/raw/Test_NoisyLR/NoisyLR

# ==========================================================
# Training
# ==========================================================

training:
  batch_size: 8
  epochs: 2
  learning_rate: 0.0001
  num_workers: 0
  seed: 42
  device: auto

  # Debug mode
  debug: false
  debug_train_samples: 32
  debug_val_samples: 8

# ==========================================================
# Optimizer
# ==========================================================

optimizer:
  name: Adam
  weight_decay: 0.0

# ==========================================================
# Scheduler
# ==========================================================

scheduler:
  name: CosineAnnealingLR

# ==========================================================
# Loss
# ==========================================================

loss:
  name: GradientL1Loss
  lambda_gradient: 0.1

# ==========================================================
# Checkpoint
# ==========================================================

checkpoint:
  directory: checkpoints/
  save_best_only: true
  save_every: 10

# ==========================================================
# Logging
# ==========================================================

logging:
  directory: logs/
